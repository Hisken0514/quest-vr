<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 WebXR 場景</title>
  <!-- A-Frame：用 HTML 標籤寫 VR 場景 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    // 自訂元件：被手把雷射點到時換顏色
    AFRAME.registerComponent('click-color', {
      init: function () {
        const colors = ['#E8634A', '#3FA7D6', '#F2C14E', '#5FAD56', '#9B5DE5'];
        let i = 0;
        this.el.addEventListener('click', () => {
          i = (i + 1) % colors.length;
          this.el.setAttribute('color', colors[i]);
        });
        this.el.addEventListener('mouseenter', () => this.el.setAttribute('scale', '1.15 1.15 1.15'));
        this.el.addEventListener('mouseleave', () => this.el.setAttribute('scale', '1 1 1'));
      }
    });
  </script>
</head>
<body>
  <a-scene renderer="antialias: true" background="color: #BFD9EA">

    <!-- 天空與燈光 -->
    <a-sky color="#BFD9EA"></a-sky>
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="2 4 1"></a-entity>

    <!-- 地板 -->
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BA05B"></a-plane>

    <!-- 可互動的物件（用雷射指著按扳機會變色） -->
    <a-box class="clickable" click-color position="-1.2 1 -3" color="#E8634A"></a-box>
    <a-sphere class="clickable" click-color position="0 1.25 -3.5" radius="0.6" color="#3FA7D6"></a-sphere>
    <a-cylinder class="clickable" click-color position="1.2 0.75 -3" radius="0.4" height="1.5" color="#F2C14E"></a-cylinder>

    <!-- 會旋轉的裝飾 -->
    <a-torus position="0 3 -5" radius="0.8" radius-tubular="0.08" color="#9B5DE5"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-torus>

    <!-- 文字 -->
    <a-text value="Hello Quest 3!" position="0 2.4 -3" align="center" width="6" color="#1D3557"></a-text>

    <!-- 玩家：頭盔視角 + 左右手把雷射 -->
    <a-entity id="rig" position="0 0 0">
      <a-entity camera look-controls wasd-controls position="0 1.6 0"
                cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
