<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 WebXR 場景</title>
  <!-- A-Frame：用 HTML 標籤寫 VR 場景 -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script>
    // 自訂元件：被手把雷射點到時換顏色
    AFRAME.registerComponent('click-color', {
      init: function () {
        const colors = ['#E8634A', '#3FA7D6', '#F2C14E', '#5FAD56', '#9B5DE5'];
        let i = 0;
        this.el.addEventListener('click', () => {
          i = (i + 1) % colors.length;
          this.el.setAttribute('color', colors[i]);
        });
        this.el.addEventListener('mouseenter', () => this.el.setAttribute('scale', '1.15 1.15 1.15'));
        this.el.addEventListener('mouseleave', () => this.el.setAttribute('scale', '1 1 1'));
      }
    });
  </script>
</head>
<body>
  <a-scene renderer="antialias: true" background="color: #BFD9EA">

    <!-- 天空與燈光 -->
    <a-sky color="#BFD9EA"></a-sky>
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="2 4 1"></a-entity>

    <!-- 地板 -->
    <a-plane rotation="-90 0 0" width="30" height="30" color="#7BA05B"></a-plane>

    <!-- 可互動的物件（用雷射指著按扳機會變色） -->
    <a-box class="clickable" click-color position="-1.2 1 -3" color="#E8634A"></a-box>
    <a-sphere class="clickable" click-color position="0 1.25 -3.5" radius="0.6" color="#3FA7D6"></a-sphere>
    <a-cylinder class="clickable" click-color position="1.2 0.75 -3" radius="0.4" height="1.5" color="#F2C14E"></a-cylinder>

    <!-- 會旋轉的裝飾 -->
    <a-torus position="0 3 -5" radius="0.8" radius-tubular="0.08" color="#9B5DE5"
             animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear"></a-torus>

    <!-- 原創電動車「Aurora」：放在右前方展示台上，緩慢旋轉 -->
    <a-cylinder position="4 0.05 -4" radius="2.6" height="0.1" color="#D9DEE4"></a-cylinder>
    <a-entity position="4 0.1 -4"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
      <!-- 車身下半 -->
      <a-box position="0 0.55 0" width="4.2" height="0.5" depth="1.8" color="#2B6CB0" metalness="0.6" roughness="0.3"></a-box>
      <!-- 前後斜面 -->
      <a-box position="1.95 0.62 0" width="0.6" height="0.36" depth="1.78" rotation="0 0 -18" color="#2B6CB0" metalness="0.6" roughness="0.3"></a-box>
      <a-box position="-1.95 0.66 0" width="0.5" height="0.4" depth="1.78" rotation="0 0 12" color="#2B6CB0" metalness="0.6" roughness="0.3"></a-box>
      <!-- 玻璃座艙（半顆膠囊） -->
      <a-sphere position="-0.1 0.8 0" radius="1" scale="1.55 0.5 0.8" theta-length="90" color="#1A202C" metalness="0.9" roughness="0.1" opacity="0.85"></a-sphere>
      <!-- 車頂光條 -->
      <a-box position="-0.1 1.3 0" width="1.6" height="0.03" depth="0.08" color="#7FDBFF" material="emissive: #7FDBFF; emissiveIntensity: 0.8"></a-box>
      <!-- 頭燈：一條貫穿燈帶 -->
      <a-box position="2.22 0.68 0" width="0.04" height="0.06" depth="1.5" color="#FFFFFF" material="emissive: #E6F7FF; emissiveIntensity: 1"></a-box>
      <!-- 尾燈 -->
      <a-box position="-2.12 0.75 0" width="0.04" height="0.08" depth="1.6" color="#FF4D6D" material="emissive: #FF4D6D; emissiveIntensity: 1"></a-box>
      <!-- 輪子 ×4（輪胎 + 輪框） -->
      <a-entity position="1.35 0.38 0.9">
        <a-cylinder radius="0.38" height="0.26" rotation="90 0 0" color="#1B1B1B"></a-cylinder>
        <a-cylinder radius="0.24" height="0.28" rotation="90 0 0" color="#C0C7D0" metalness="0.8" roughness="0.2"></a-cylinder>
      </a-entity>
      <a-entity position="1.35 0.38 -0.9">
        <a-cylinder radius="0.38" height="0.26" rotation="90 0 0" color="#1B1B1B"></a-cylinder>
        <a-cylinder radius="0.24" height="0.28" rotation="90 0 0" color="#C0C7D0" metalness="0.8" roughness="0.2"></a-cylinder>
      </a-entity>
      <a-entity position="-1.35 0.38 0.9">
        <a-cylinder radius="0.38" height="0.26" rotation="90 0 0" color="#1B1B1B"></a-cylinder>
        <a-cylinder radius="0.24" height="0.28" rotation="90 0 0" color="#C0C7D0" metalness="0.8" roughness="0.2"></a-cylinder>
      </a-entity>
      <a-entity position="-1.35 0.38 -0.9">
        <a-cylinder radius="0.38" height="0.26" rotation="90 0 0" color="#1B1B1B"></a-cylinder>
        <a-cylinder radius="0.24" height="0.28" rotation="90 0 0" color="#C0C7D0" metalness="0.8" roughness="0.2"></a-cylinder>
      </a-entity>
      <!-- 可點擊換車色的按鈕區（點車身側板） -->
      <a-box class="clickable" click-color position="0 0.55 0.91" width="2.4" height="0.3" depth="0.02" color="#2B6CB0" metalness="0.6" roughness="0.3"></a-box>
    </a-entity>
    <a-text value="AURORA EV" position="4 0.4 -1.2" align="center" width="5" color="#1D3557"></a-text>

    <!-- 文字 -->
    <a-text value="Hello Quest 3!" position="0 2.4 -3" align="center" width="6" color="#1D3557"></a-text>

    <!-- 玩家：頭盔視角 + 左右手把雷射 -->
    <a-entity id="rig" position="0 0 0">
      <a-entity camera look-controls wasd-controls position="0 1.6 0"
                cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .clickable; far: 20"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .clickable; far: 20"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
